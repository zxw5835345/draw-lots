<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>抽签</title>
<style>
  :root{
    --bg:#06070a;
    --text:#f1ece1;
    --muted:#8b9099;
    --dim:#6a6f77;
    --line:rgba(233,214,171,.16);
    --gold:#d8b667;
    --gold-lt:#f3dfae;
    --gold-dk:#8a6a24;
    --serif:"Songti SC","STSong","SimSun",Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    background:
      radial-gradient(1200px 780px at 50% -10%, rgba(216,182,103,.11), rgba(6,7,10,0) 60%),
      radial-gradient(900px 620px at 50% 118%, rgba(92,118,180,.07), rgba(6,7,10,0) 62%),
      radial-gradient(1400px 900px at 50% 45%, #0b0d12 0%, #06070a 72%);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  body::after{
    content:"";
    position:fixed;inset:0;
    pointer-events:none;z-index:2;opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='0.55'/></svg>");
  }

  .app{
    position:relative;z-index:3;
    height:100vh;
    display:grid;
    grid-template-columns:300px minmax(0,1fr) 274px;
    grid-template-rows:auto minmax(0,1fr);
    gap:16px;
    padding:18px 20px 20px;
  }

  header{
    grid-column:1/-1;
    display:flex;align-items:center;gap:16px;
    padding:2px 4px 15px;
    border-bottom:1px solid rgba(233,214,171,.09);
  }
  .brand{
    font-family:var(--serif);font-size:24px;font-weight:700;
    letter-spacing:.44em;text-indent:.44em;color:#f6efdd;user-select:none;
  }
  .brand i{font-style:normal;color:var(--gold)}
  .sub{font-size:11.5px;color:var(--muted);letter-spacing:.2em}
  .kbd{
    margin-left:auto;display:flex;align-items:center;gap:8px;
    font-size:10.5px;color:var(--dim);letter-spacing:.14em;
  }
  .kbd b{
    font-weight:500;padding:3px 9px;border:1px solid rgba(255,255,255,.11);
    border-radius:5px;color:#c6bfae;background:rgba(255,255,255,.03);letter-spacing:.1em;
  }

  .panel{
    background:linear-gradient(180deg,rgba(255,255,255,.052),rgba(255,255,255,.016));
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px 15px 15px;
    display:flex;flex-direction:column;gap:12px;
    min-height:0;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 24px 60px rgba(0,0,0,.38);
  }

  .label{
    font-size:10px;letter-spacing:.3em;color:var(--dim);
    display:flex;align-items:center;justify-content:space-between;
  }
  .label .count{letter-spacing:.08em;font-size:11.5px;color:#a99f8c}

  textarea{
    flex:1;min-height:150px;resize:none;
    background:rgba(0,0,0,.3);
    border:1px solid rgba(255,255,255,.07);
    border-radius:12px;
    color:#e9e3d6;font:inherit;font-size:14px;line-height:1.95;
    padding:12px 13px;outline:none;
    transition:border-color .2s, box-shadow .2s, background .2s;
  }
  textarea:focus{
    border-color:rgba(216,182,103,.45);
    box-shadow:0 0 0 3px rgba(216,182,103,.07);
    background:rgba(0,0,0,.38);
  }
  textarea::placeholder{color:#565b63}

  .tip{font-size:11px;color:#6f747c;line-height:1.7;letter-spacing:.02em}

  .row{display:flex;align-items:center;gap:9px;font-size:12.5px;color:#cdc6b7}
  .row.between{justify-content:space-between}

  .check{
    display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;
    color:#cac3b4;font-size:12.5px;letter-spacing:.03em;
  }
  .check input{
    appearance:none;width:15px;height:15px;border-radius:4px;
    border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.04);
    position:relative;cursor:pointer;transition:.16s;flex:none;
  }
  .check input:checked{
    background:linear-gradient(180deg,#f2dca4,#c8a253);
    border-color:rgba(216,182,103,.8);
  }
  .check input:checked::after{
    content:"";position:absolute;left:4.5px;top:1.5px;width:3.5px;height:7px;
    border:solid #2a1d05;border-width:0 1.6px 1.6px 0;transform:rotate(42deg);
  }

  input[type=number]{
    width:62px;background:rgba(0,0,0,.3);
    border:1px solid rgba(255,255,255,.09);border-radius:8px;
    color:#efe8d8;font:inherit;font-size:12.5px;
    padding:5px 8px;outline:none;text-align:center;
  }
  input[type=number]:focus{border-color:rgba(216,182,103,.5)}

  .btns{display:flex;gap:8px}
  button{
    font:inherit;cursor:pointer;border-radius:9px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.035);
    color:#d8d2c4;font-size:12.5px;letter-spacing:.04em;
    padding:8px 13px;transition:.18s;
  }
  button:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.18);color:#f3eddf}
  button:active{transform:translateY(1px)}
  button.ghost{background:transparent;border-color:rgba(255,255,255,.09);color:#bdb6a7}
  button.ghost:hover{color:#efe8d8;border-color:rgba(255,255,255,.18)}
  button.accent{
    border-color:rgba(216,182,103,.42);color:#efd9a8;background:rgba(216,182,103,.09);
  }
  button.accent:hover{background:rgba(216,182,103,.16);border-color:rgba(216,182,103,.55)}

  .stats{
    font-size:11px;color:var(--dim);
    display:flex;gap:16px;
    border-top:1px solid rgba(255,255,255,.055);
    padding-top:10px;letter-spacing:.06em;
  }
  .stats b{color:#ddd5c3;font-weight:600;font-variant-numeric:tabular-nums}

  /* ---------- 舞台：名字滚动 ---------- */
  .stage{
    position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:20px;min-height:0;
  }

  .reel-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px}
  .reel-stage::before{
    content:"";position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);
    width:min(780px,94%);height:360px;border-radius:50%;
    background:radial-gradient(ellipse at 50% 50%, rgba(216,182,103,.13), rgba(216,182,103,0) 66%);
    filter:blur(20px);pointer-events:none;
  }

  .reel-cap{
    position:relative;
    font-size:10.5px;letter-spacing:.52em;text-indent:.52em;
    color:var(--dim);transition:color .35s ease;
  }
  .reel-cap.win{color:var(--gold)}

  .reel{
    position:relative;
    width:min(580px,84vw);
    height:118px;
    overflow:hidden;
    border-top:1px solid rgba(233,214,171,.28);
    border-bottom:1px solid rgba(233,214,171,.28);
  }
  .reel.locked{animation:lockFlash 720ms ease-out}
  @keyframes lockFlash{
    0%{box-shadow:0 0 0 rgba(216,182,103,0)}
    30%{box-shadow:0 0 46px rgba(216,182,103,.26)}
    100%{box-shadow:0 0 0 rgba(216,182,103,0)}
  }

  .reel__track{will-change:transform}
  .reel__row{
    height:118px;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);
    font-size:clamp(32px,5.8vh,56px);
    font-weight:700;
    letter-spacing:.1em;text-indent:.1em;
    color:#e6dcc6;
    transition:color .5s ease, text-shadow .5s ease;
  }
  .reel__row.win{color:#f7e4b0;text-shadow:0 0 30px rgba(216,182,103,.32)}

  .reel-hint{
    position:relative;
    font-size:11px;color:#5d626a;letter-spacing:.16em;
    font-variant-numeric:tabular-nums;
  }

  /* 结果 */
  .result{
    min-height:0;
    display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
    gap:11px;width:100%;padding:0 6px;
  }
  .chip{
    padding:9px 18px;border-radius:10px;
    background:rgba(216,182,103,.08);
    border:1px solid rgba(216,182,103,.3);
    color:#f1ddb0;font-size:15px;letter-spacing:.06em;
    opacity:0;transform:translateY(10px) scale(.94);
    transition:opacity .3s ease, transform .32s cubic-bezier(.2,.9,.25,1.4);
  }
  .chip.in{opacity:1;transform:none}

  /* 主按钮 */
  .spin{
    position:relative;
    border:none;cursor:pointer;
    padding:13px 42px;
    border-radius:999px;
    background:linear-gradient(180deg,#f8e5b6 0%,#e3c07a 42%,#bf9647 100%);
    color:#2a1d05;
    font-family:var(--serif);
    font-weight:700;
    font-size:15px;
    letter-spacing:.34em;
    text-indent:.34em;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.75),
      inset 0 -7px 16px rgba(120,80,0,.28),
      0 12px 30px rgba(0,0,0,.45),
      0 0 0 1px rgba(255,240,200,.3);
    transition:transform .16s ease, box-shadow .22s ease, filter .22s;
  }
  .spin:hover:not(:disabled){
    transform:translateY(-1px);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.8),
      inset 0 -7px 16px rgba(120,80,0,.26),
      0 16px 36px rgba(0,0,0,.5),
      0 0 34px rgba(216,182,103,.22);
  }
  .spin:active:not(:disabled){transform:translateY(1px)}
  .spin:disabled{cursor:default;filter:grayscale(.35) brightness(.82)}

  /* ---------- 记录 ---------- */
  .history{
    flex:1;min-height:0;overflow:auto;
    display:flex;flex-direction:column;padding-right:2px;
  }
  .history::-webkit-scrollbar{width:5px}
  .history::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
  .history .empty{font-size:11.5px;color:#565b63;padding:10px 2px;letter-spacing:.08em}
  .item{
    display:flex;align-items:center;gap:10px;
    padding:10px 2px;
    border-bottom:1px solid rgba(255,255,255,.045);
    font-size:13.5px;
  }
  .item .no{width:18px;flex:none;color:#5a5f67;font-size:10.5px;font-variant-numeric:tabular-nums}
  .item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#e7e0d1}
  .item .tm{font-size:10.5px;color:#5d626a;font-variant-numeric:tabular-nums;letter-spacing:.04em}

  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}

  .toast{
    position:fixed;left:50%;bottom:34px;transform:translate(-50%,14px);
    background:rgba(18,20,25,.95);
    border:1px solid rgba(233,214,171,.16);
    color:#ece5d6;font-size:12.5px;letter-spacing:.06em;
    padding:10px 20px;border-radius:10px;
    opacity:0;pointer-events:none;transition:.24s ease;z-index:30;
    box-shadow:0 16px 40px rgba(0,0,0,.55);
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---------- 隐藏设置（权重） ---------- */
  .secret{
    position:fixed;inset:0;z-index:50;
    display:grid;place-items:center;padding:20px;
    background:rgba(4,5,7,.66);
    backdrop-filter:blur(8px);
    animation:fadeIn .2s ease;
  }
  .secret[hidden]{display:none}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .secret-card{
    width:min(560px,100%);
    max-height:min(80vh,660px);
    display:flex;flex-direction:column;gap:13px;
    padding:20px;border-radius:16px;
    border:1px solid rgba(233,214,171,.18);
    background:linear-gradient(180deg,#15171d,#0e1014);
    box-shadow:0 40px 100px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .secret-head{display:flex;align-items:flex-start;gap:12px}
  .secret-title{
    font-family:var(--serif);font-size:16px;font-weight:700;
    letter-spacing:.14em;color:#f4ecd9;
  }
  .secret-sub{font-size:11px;color:#7d828a;margin-top:6px;line-height:1.7;letter-spacing:.02em}
  .secret-head button{margin-left:auto;flex:none}
  .secret-list{
    flex:1;min-height:0;overflow:auto;
    display:flex;flex-direction:column;gap:5px;padding-right:3px;
  }
  .secret-list::-webkit-scrollbar{width:5px}
  .secret-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
  .secret-list .empty{font-size:12px;color:#5d626a;padding:10px 2px}
  .wrow{
    display:flex;align-items:center;gap:10px;
    padding:7px 10px;border-radius:8px;
    background:rgba(255,255,255,.028);
    border:1px solid rgba(255,255,255,.045);
  }
  .wrow.dim{opacity:.4}
  .wrow .n{
    flex:1;font-size:13px;color:#e7e0d1;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .wrow input{width:74px;text-align:center;font-size:12.5px}
  .wrow .p{
    width:58px;text-align:right;font-size:11.5px;color:#a49b89;
    font-variant-numeric:tabular-nums;
  }
  .secret-foot{
    display:flex;align-items:center;gap:10px;
    border-top:1px solid rgba(255,255,255,.07);padding-top:12px;
  }
  .secret-foot .sum{font-size:11px;color:#7d828a;margin-left:auto;letter-spacing:.06em}

  @media (max-width:1080px){
    body{overflow:auto}
    .app{height:auto;grid-template-columns:1fr;grid-template-rows:auto}
    header{order:-2;padding:6px 2px 12px}
    .brand{font-size:21px;letter-spacing:.34em;text-indent:.34em}
    .kbd{display:none}
    .stage{order:-1;padding:10px 0 4px}
    .tube-stage{height:min(52vh,420px)}
    .panel{max-height:none}
    textarea{min-height:120px}
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">抽<i>签</i></div>
    <div class="sub">把难选的事交给运气</div>
    <div class="kbd"><b>空格</b> 抽一签</div>
  </header>

  <aside class="panel">
    <div class="label">名单 <span class="count" id="nameCount">0 个</span></div>
    <textarea id="names" spellcheck="false" placeholder="每行一个名字，也可用逗号、顿号或空格分隔&#10;例如：张伟, 王芳, 李娜 刘洋"></textarea>
    <div class="tip">名单从同目录的 names.json 读取，所有人看到的是同一份；在这里改动只在本次有效。空行与重复项会自动忽略。</div>

    <label class="check"><input type="checkbox" id="noRepeat" checked> 不重复抽取</label>

    <div class="row between">
      <span style="color:#d5dae2">每次抽</span>
      <span class="row" style="gap:6px">
        <input type="number" id="count" value="1" min="1" max="50" step="1">
        <span style="color:var(--muted);font-size:13px">个</span>
      </span>
    </div>

    <div class="btns">
      <button id="reset" class="accent" style="flex:1">重新开始</button>
      <button id="sample" class="ghost">示例</button>
      <button id="clearNames" class="ghost">清空</button>
    </div>

    <div class="stats">
      <span>剩余 <b id="leftNum">0</b></span>
      <span>已抽 <b id="drawnNum">0</b></span>
    </div>
  </aside>

  <main class="stage">
    <div class="reel-stage">
      <div class="reel-cap" id="reelCap">等 待 抽 签</div>
      <div class="reel" id="reel"><div class="reel__track" id="reelTrack"></div></div>
      <div class="reel-hint" id="reelHint">按空格或点下面的按钮</div>
    </div>
    <div class="result" id="result" aria-live="polite"></div>
    <button class="spin" id="spin">抽一签</button>
  </main>
  </main>

  <aside class="panel">
    <div class="label">抽签记录 <span class="count" id="historyCount"></span></div>
    <div class="history" id="history">
      <div class="empty">还没有记录</div>
    </div>
    <button id="clearHistory" class="ghost">清空记录</button>
  </aside>
</div>

<canvas id="fx"></canvas>
<div class="toast" id="toast"></div>

<div class="secret" id="secret" hidden>
  <div class="secret-card">
    <div class="secret-head">
      <div>
        <div class="secret-title">抽取设置</div>
        <div class="secret-sub">权重越大越容易被抽中；设为 0 表示不会被抽到。只在本次打开有效，刷新即恢复均等，别人打开一律等概率。</div>
      </div>
      <button id="secretClose" class="ghost">关闭</button>
    </div>
    <div class="secret-list" id="secretList"></div>
    <div class="secret-foot">
      <button id="wEqual" class="ghost">全部均等</button>
      <span class="sum" id="wSum"></span>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var PALETTE = ["#f3dfae", "#e3c47f", "#c9a44f", "#efe8d8", "#b8934a", "#fff4d6"];
  var SAMPLE = ["张伟", "王芳", "李娜", "刘洋", "陈晨", "杨帆", "赵磊", "周敏", "吴桐", "徐蕾"];

  var $ = function (s) { return document.querySelector(s); };

  var state = {
    names: [],
    drawn: new Set(),
    history: [],
    spinning: false,
    count: 1,
    noRepeat: true,
    weights: {}
  };

  var el = {
    names: $("#names"),
    nameCount: $("#nameCount"),
    noRepeat: $("#noRepeat"),
    count: $("#count"),
    reset: $("#reset"),
    sample: $("#sample"),
    clearNames: $("#clearNames"),
    clearHistory: $("#clearHistory"),
    leftNum: $("#leftNum"),
    drawnNum: $("#drawnNum"),
    history: $("#history"),
    historyCount: $("#historyCount"),
    result: $("#result"),
    spin: $("#spin"),
    reel: $("#reel"),
    reelTrack: $("#reelTrack"),
    reelCap: $("#reelCap"),
    reelHint: $("#reelHint"),
    fx: $("#fx"),
    toast: $("#toast"),
    secret: $("#secret"),
    secretList: $("#secretList"),
    secretClose: $("#secretClose"),
    wEqual: $("#wEqual"),
    wSum: $("#wSum")
  };

  /* ---------------- 基础工具 ---------------- */

  function toast(msg) {
    el.toast.textContent = msg;
    el.toast.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.toast.classList.remove("show"); }, 2200);
  }

  function randInt(n) {
    if (window.crypto && window.crypto.getRandomValues) {
      var a = new Uint32Array(1);
      var limit = Math.floor(4294967296 / n) * n;
      for (var i = 0; i < 40; i++) {
        window.crypto.getRandomValues(a);
        if (a[0] < limit) return a[0] % n;
      }
      return a[0] % n;
    }
    return Math.floor(Math.random() * n);
  }

  function randFloat() {
    if (window.crypto && window.crypto.getRandomValues) {
      var a = new Uint32Array(1);
      window.crypto.getRandomValues(a);
      return a[0] / 4294967296;
    }
    return Math.random();
  }

  function parseNames(text) {
    var raw = text.split(/[\n\r,，、;；\s]+/);
    var seen = Object.create(null);
    var out = [];
    for (var i = 0; i < raw.length; i++) {
      var s = raw[i].trim();
      if (!s || seen[s]) continue;
      seen[s] = 1;
      out.push(s);
    }
    return out;
  }

  function candidates() {
    if (!state.noRepeat) return state.names.slice();
    return state.names.filter(function (n) { return !state.drawn.has(n); });
  }

  /* ---------------- 权重（隐藏） ---------------- */

  function weightOf(name) {
    var w = state.weights[name];
    if (typeof w !== "number" || !isFinite(w)) return 1;
    return w > 0 ? w : 0;
  }

  function pickIndex(list) {
    var i, ws = [], total = 0;
    for (i = 0; i < list.length; i++) {
      var w = weightOf(list[i]);
      ws.push(w);
      total += w;
    }
    if (!(total > 0)) return randInt(list.length);
    var r = randFloat() * total;
    var acc = 0;
    for (i = 0; i < list.length; i++) {
      acc += ws[i];
      if (r < acc) return i;
    }
    return list.length - 1;
  }

  function pickMany(list, k) {
    var pool = list.slice(), out = [];
    while (out.length < k && pool.length) {
      var idx = pickIndex(pool);
      out.push(pool[idx]);
      pool.splice(idx, 1);
    }
    return out;
  }

  /* ---------------- 结果与记录 ---------------- */

  function clearResult() {
    el.result.innerHTML = "";
  }

  function showWinner(name) {
    clearResult();
    var wrap = document.createElement("div");
    wrap.className = "winner";
    var cap = document.createElement("span");
    cap.className = "cap";
    cap.textContent = "抽中";
    var strong = document.createElement("strong");
    strong.textContent = name;
    wrap.appendChild(cap);
    wrap.appendChild(strong);
    el.result.appendChild(wrap);
    requestAnimationFrame(function () { wrap.classList.add("in"); });
  }

  function renderHistory() {
    el.history.innerHTML = "";
    if (!state.history.length) {
      var d = document.createElement("div");
      d.className = "empty";
      d.textContent = "还没有记录";
      el.history.appendChild(d);
      el.historyCount.textContent = "";
      return;
    }
    el.historyCount.textContent = state.history.length + " 条";
    var frag = document.createDocumentFragment();
    state.history.forEach(function (rec, i) {
      var item = document.createElement("div");
      item.className = "item";
      var no = document.createElement("span");
      no.className = "no";
      no.textContent = String(state.history.length - i);
      var nm = document.createElement("span");
      nm.className = "nm";
      nm.textContent = rec.name;
      var tm = document.createElement("span");
      tm.className = "tm";
      tm.textContent = rec.time;
      item.appendChild(no);
      item.appendChild(nm);
      item.appendChild(tm);
      frag.appendChild(item);
    });
    el.history.appendChild(frag);
  }

  function updateStats() {
    var left = candidates().length;
    el.leftNum.textContent = left;
    el.drawnNum.textContent = state.drawn.size;
    el.nameCount.textContent = state.names.length + " 个";
    el.spin.textContent = state.spinning ? "抽签中" : (state.names.length && left === 0 ? "已抽完" : "抽一签");
    if (el.reelHint) {
      el.reelHint.textContent = state.names.length
        ? "共 " + state.names.length + " 人 · 剩余 " + left + " 人"
        : "先在左侧输入名单";
    }
  }

  function setName(name) {
    if (state.noRepeat) state.drawn.add(name);
    var t = new Date();
    var hh = String(t.getHours()).padStart(2, "0");
    var mm = String(t.getMinutes()).padStart(2, "0");
    var ss = String(t.getSeconds()).padStart(2, "0");
    state.history.unshift({ name: name, time: hh + ":" + mm + ":" + ss });
  }

  function commit(names) {
    names.forEach(setName);
    renderHistory();
    updateStats();
    confetti();
  }

  /* ---------------- 抽签动画 ---------------- */

  var ROW_H = 118;

  function setReelIdle() {
    el.reel.classList.remove("locked");
    el.reelCap.classList.remove("win");
    el.reelCap.textContent = "等 待 抽 签";
    el.reelTrack.style.transition = "none";
    el.reelTrack.style.transform = "translateY(0px)";
    el.reelTrack.innerHTML = "";
    var d = document.createElement("div");
    d.className = "reel__row";
    d.textContent = "—";
    el.reelTrack.appendChild(d);
  }

  function setReelStatic(name) {
    el.reelTrack.innerHTML = "";
    el.reelTrack.style.transition = "none";
    el.reelTrack.style.transform = "translateY(0px)";
    var d = document.createElement("div");
    d.className = "reel__row win";
    d.textContent = name;
    el.reelTrack.appendChild(d);
  }

  function rollTo(name, onLock) {
    var pool = candidates();
    var rows = 26;
    var frag = document.createDocumentFragment();

    el.reel.classList.remove("locked");
    el.reelCap.classList.remove("win");
    el.reelCap.textContent = "抽 取 中";
    el.reelTrack.innerHTML = "";

    for (var i = 0; i < rows - 1; i++) {
      var d = document.createElement("div");
      d.className = "reel__row";
      d.textContent = pool[randInt(pool.length)];
      frag.appendChild(d);
    }
    var last = document.createElement("div");
    last.className = "reel__row win";
    last.textContent = name;
    frag.appendChild(last);
    el.reelTrack.appendChild(frag);

    el.reelTrack.style.transition = "none";
    el.reelTrack.style.transform = "translateY(0px)";
    void el.reelTrack.offsetHeight;

    var finished = false;
    function finish() {
      if (finished) return;
      finished = true;
      el.reel.classList.add("locked");
      el.reelCap.textContent = "抽 中";
      el.reelCap.classList.add("win");
      onLock();
    }

    el.reelTrack.addEventListener("transitionend", function handler(e) {
      if (e.propertyName !== "transform") return;
      el.reelTrack.removeEventListener("transitionend", handler);
      finish();
    });
    setTimeout(finish, 2900);

    el.reelTrack.style.transition = "transform 2.35s cubic-bezier(.12,.7,.16,1)";
    el.reelTrack.style.transform = "translateY(-" + ((rows - 1) * ROW_H) + "px)";

  }

  function busy(on) {
    state.spinning = on;
    el.spin.disabled = on;
    el.spin.classList.toggle("busy", on);
    updateStats();
  }

  function spin() {
    if (state.spinning) return;
    if (!state.names.length) { toast("请先在左侧输入名单"); return; }

    var list = candidates();
    if (!list.length) { toast("名单已全部抽完，点“重新开始”可重置"); return; }

    if (state.count > 1) { multiDraw(list); return; }

    var name = list[pickIndex(list)];
    clearResult();
    busy(true);

    rollTo(name, function () {
      busy(false);
      commit([name]);
    });
  }

  function multiDraw(list) {
    var c = state.count;
    if (list.length < c) { toast("剩余 " + list.length + " 个，不够抽 " + c + " 个"); return; }

    var picked = pickMany(list, c);
    clearResult();
    busy(true);
    setReelStatic(picked[0]);
    el.reelCap.classList.remove("win");
    el.reelCap.textContent = "抽 取 中";

    var chips = picked.map(function (name) {
      var d = document.createElement("div");
      d.className = "chip";
      d.textContent = name;
      el.result.appendChild(d);
      return d;
    });

    var step = 190;
    chips.forEach(function (chip, i) {
      setTimeout(function () {
        chip.classList.add("in");
      }, 240 + i * step);
    });

    setTimeout(function () {
      el.reelCap.textContent = "抽 中 " + picked.length + " 人";
      el.reelCap.classList.add("win");
      busy(false);
      commit(picked);
    }, 240 + picked.length * step + 220);
  }

  /* ---------------- 礼花 ---------------- */

  var fx = el.fx, fctx = fx.getContext("2d");
  var particles = [];
  var fxRun = false;

  function fxResize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    fx.width = Math.round(window.innerWidth * dpr);
    fx.height = Math.round(window.innerHeight * dpr);
    fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function confetti() {
    var W = window.innerWidth, H = window.innerHeight;
    var baseX = W / 2;
    var baseY = H * 0.34;
    for (var i = 0; i < 78; i++) {
      particles.push({
        x: baseX + (Math.random() - 0.5) * W * 0.3,
        y: baseY + (Math.random() - 0.5) * 30,
        vx: (Math.random() - 0.5) * 6.5,
        vy: -Math.random() * 7.5 - 2,
        g: 0.15 + Math.random() * 0.08,
        w: 2 + Math.random() * 2.6,
        h: 4.5 + Math.random() * 5.5,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.34,
        c: PALETTE[Math.floor(Math.random() * PALETTE.length)],
        life: 0,
        max: 70 + Math.random() * 60
      });
    }
    if (!fxRun) { fxRun = true; requestAnimationFrame(fxFrame); }
  }

  function fxFrame() {
    fctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life++;
      p.vy += p.g;
      p.vx *= 0.995;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      var alpha = Math.max(0, 1 - p.life / p.max);
      if (alpha <= 0 || p.y > window.innerHeight + 40) { particles.splice(i, 1); continue; }
      fctx.save();
      fctx.globalAlpha = alpha;
      fctx.translate(p.x, p.y);
      fctx.rotate(p.rot);
      fctx.fillStyle = p.c;
      fctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      fctx.restore();
    }
    if (particles.length) {
      requestAnimationFrame(fxFrame);
    } else {
      fxRun = false;
      fctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    }
  }

  /* ---------------- 名单来源与设置 ---------------- */

  // 名单统一放在同目录的 names.json（GitHub 仓库里），所有人打开读的都是同一份
  var NAMES_URL = "names.json";
  var SETTINGS_KEY = "chouqian.setting";
  var OLD_KEY = "chouqian.v1";
  var OLD_W_KEY = "cq1";

  function applyNames(list, fromRepo) {
    var names = parseNames(list.join("\n"));
    state.names = names;
    state.drawn.clear();
    el.names.value = names.join("\n");
    state.fromRepo = !!fromRepo;
  }

  function saveSettings() {
    try {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify({
        noRepeat: state.noRepeat,
        count: state.count
      }));
    } catch (e) { /* 忽略 */ }
  }

  function loadSettings() {
    var raw = null;
    try { raw = localStorage.getItem(SETTINGS_KEY); } catch (e) { raw = null; }
    var data = null;
    if (raw) { try { data = JSON.parse(raw); } catch (e) { data = null; } }
    if (data) {
      if (typeof data.noRepeat === "boolean") state.noRepeat = data.noRepeat;
      var c = parseInt(data.count, 10);
      if (c >= 1 && c <= 50) state.count = c;
    }
    el.noRepeat.checked = state.noRepeat;
    el.count.value = state.count;
  }

  function boot() {
    // 每次打开都从“所有人等概率”开始：清掉旧版本留在本机的权重与名单缓存
    state.weights = {};
    try {
      localStorage.removeItem(OLD_W_KEY);
      localStorage.removeItem(OLD_KEY);
    } catch (e) { /* 忽略 */ }

    loadSettings();

    function fallback() {
      applyNames(SAMPLE, false);
      updateStats();
    }

    var req;
    try {
      req = window.fetch ? fetch(NAMES_URL, { cache: "no-store" }) : null;
    } catch (e) { req = null; }
    if (!req || typeof req.then !== "function") { fallback(); return; }

    req.then(function (res) {
      if (!res.ok) throw new Error("status " + res.status);
      return res.json();
    }).then(function (cfg) {
      var list = cfg && Array.isArray(cfg.names) ? cfg.names : null;
      if (!list || !list.length) throw new Error("empty names");
      applyNames(list, true);
      updateStats();
    }).catch(function () {
      fallback();
    });
  }

  /* ---------------- 隐藏设置面板 ---------------- */

  function poolWeightTotal() {
    var c = candidates(), t = 0;
    for (var i = 0; i < c.length; i++) t += weightOf(c[i]);
    return t;
  }

  function refreshPct() {
    var inPool = new Set(candidates());
    var total = poolWeightTotal();
    var nodes = el.secretList.querySelectorAll(".p");
    for (var i = 0; i < nodes.length; i++) {
      var name = nodes[i].getAttribute("data-name");
      var w = inPool.has(name) ? weightOf(name) : 0;
      nodes[i].parentNode.classList.toggle("dim", !inPool.has(name));
      nodes[i].textContent = total > 0 ? (w / total * 100).toFixed(1) + "%" : "—";
    }
    el.wSum.textContent = "合计权重 " + (Math.round(total * 10) / 10);
  }

  function renderSecret() {
    el.secretList.innerHTML = "";
    if (!state.names.length) {
      var d = document.createElement("div");
      d.className = "empty";
      d.textContent = "名单为空，先在左侧添加名字";
      el.secretList.appendChild(d);
      el.wSum.textContent = "";
      return;
    }
    state.names.forEach(function (name) {
      var row = document.createElement("div");
      row.className = "wrow";

      var n = document.createElement("span");
      n.className = "n";
      n.textContent = name;

      var inp = document.createElement("input");
      inp.type = "number";
      inp.min = "0";
      inp.max = "999";
      inp.step = "0.5";
      inp.value = String(weightOf(name));
      inp.addEventListener("input", function () {
        var v = parseFloat(inp.value);
        if (!isFinite(v) || v < 0) v = 0;
        if (v > 999) v = 999;
        state.weights[name] = v;
        refreshPct();
      });
      inp.addEventListener("blur", function () {
        inp.value = String(weightOf(name));
      });

      var p = document.createElement("span");
      p.className = "p";
      p.setAttribute("data-name", name);

      row.appendChild(n);
      row.appendChild(inp);
      row.appendChild(p);
      el.secretList.appendChild(row);
    });
    refreshPct();
  }

  function openSecret() {
    renderSecret();
    el.secret.hidden = false;
  }

  function closeSecret() {
    el.secret.hidden = true;
  }

  /* ---------------- 事件 ---------------- */

  el.names.addEventListener("input", function () {
    state.names = parseNames(el.names.value);
    var alive = new Set(state.names);
    state.drawn.forEach(function (n) { if (!alive.has(n)) state.drawn.delete(n); });
    updateStats();
    if (el.result.querySelector(".winner")) clearResult();
  });

  el.noRepeat.addEventListener("change", function () {
    state.noRepeat = el.noRepeat.checked;
    updateStats();
    saveSettings();
  });

  el.count.addEventListener("change", function () {
    var v = parseInt(el.count.value, 10);
    if (!v || v < 1) v = 1;
    if (v > 50) v = 50;
    state.count = v;
    el.count.value = v;
    saveSettings();
  });

  el.spin.addEventListener("click", spin);
  el.reel.addEventListener("click", spin);

  el.reset.addEventListener("click", function () {
    state.drawn.clear();
    state.history = [];
    clearResult();
    setReelIdle();
    renderHistory();
    updateStats();
    toast("已重置，名单保留");
  });

  el.sample.addEventListener("click", function () {
    state.names = SAMPLE.slice();
    state.drawn.clear();
    state.history = [];
    el.names.value = SAMPLE.join("\n");
    clearResult();
    setReelIdle();
    renderHistory();
    updateStats();
    saveSettings();
    toast("已填入示例名单");
  });

  el.clearNames.addEventListener("click", function () {
    el.names.value = "";
    state.names = [];
    state.drawn.clear();
    clearResult();
    setReelIdle();
    updateStats();
    saveSettings();
    toast("名单已清空");
  });

  el.clearHistory.addEventListener("click", function () {
    state.history = [];
    renderHistory();
    toast("记录已清空，已抽状态保留");
  });

  document.addEventListener("keydown", function (e) {
    var tag = (e.target && e.target.tagName) || "";
    if (tag === "TEXTAREA" || tag === "INPUT") return;
    if (e.key === "Escape" && !el.secret.hidden) { closeSecret(); return; }
    if (e.code === "Space" || e.key === " ") {
      e.preventDefault();
      spin();
    }
  });

  /* 隐藏入口：只在网址后加 #w 打开 */
  el.secretClose.addEventListener("click", closeSecret);
  el.secret.addEventListener("click", function (e) {
    if (e.target === el.secret) closeSecret();
  });

  el.wEqual.addEventListener("click", function () {
    state.weights = {};
    renderSecret();
    toast("已恢复等概率");
  });

  window.addEventListener("hashchange", function () {
    if (location.hash === "#w" || location.hash === "#weight") openSecret();
  });

  window.addEventListener("resize", fxResize);

  boot();
  fxResize();
  updateStats();
  renderHistory();
  setReelIdle();

  if (location.hash === "#w" || location.hash === "#weight") {
    openSecret();
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  }

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { /* 字体就绪后无需重绘 */ });
  }
})();
</script>
</body>
</html>
